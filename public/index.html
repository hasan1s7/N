<script id="nabu-startup-guard">/* Independent, dependency-free guard: keep this before the application bundle. */
(function () {
  'use strict';
  var ready = false;
  var failure = null;
  var timer = setTimeout(function () {
    fail(new Error('Startup took too long. Close other Nabu tabs, then retry. Your saved words have not been reset.'));
  }, 12000);
  function stage(message) {
    var node = document.getElementById('startup-status');
    if (node) node.textContent = message;
  }
  function fail(error) {
    if (ready || failure) return;
    failure = error || new Error('The application could not start.');
    clearTimeout(timer);
    var main = document.getElementById('main');
    if (!main) return;
    var panel = document.createElement('section');
    panel.className = 'fatal';
    panel.setAttribute('role', 'alert');
    var title = document.createElement('h1');
    title.textContent = 'Nabu could not finish starting.';
    var detail = document.createElement('p');
    detail.id = 'startup-error';
    detail.textContent = failure.message || String(failure);
    var safety = document.createElement('p');
    safety.textContent = 'Your library has not been reset. Do not clear browser site data; that can remove your saved words.';
    var actions = document.createElement('div');
    actions.className = 'button-row';
    var retry = document.createElement('a');
    retry.className = 'button primary';
    retry.href = location.href;
    retry.textContent = 'Retry loading';
    var repair = document.createElement('a');
    repair.className = 'button secondary';
    repair.href = './nabu-repair.html';
    repair.textContent = 'Repair app loading';
    actions.appendChild(retry);actions.appendChild(repair);
    panel.appendChild(title);panel.appendChild(detail);panel.appendChild(safety);panel.appendChild(actions);
    var help = document.createElement('p');
    help.className = 'small-print';
    help.textContent = 'Repair refreshes the app files, not the word database. A storage-permission problem still requires allowing storage in your browser.';
    panel.appendChild(help);
    main.replaceChildren(panel);
    window.__nabuStartupError = detail.textContent;
  }
  window.NabuStartup = {
    stage: stage,
    fail: fail,
    ready: function () {
      ready = true;
      clearTimeout(timer);
      window.__nabuReady = true;
      delete window.__nabuStartupError;
      document.documentElement.setAttribute('data-nabu-ready', 'true');
    }
  };
  window.addEventListener('error', function (event) {
    if (event.error) fail(event.error);
    else if (event.target && event.target.tagName === 'SCRIPT') fail(new Error('An application script was blocked or missing. Use Repair app loading.'));
  }, true);
  window.addEventListener('unhandledrejection', function (event) { fail(event.reason); });

const langOptions = selected => C.LANGUAGES.map(([code,name])=>`<option value="${code}"${code===selected?' selected':''}>${name}</option>`).join('');
const deckOptions = (selected='', all=true) => (all?'<option value="">All collections</option>':'')+[...new Set(state.cards.filter(c=>!c.archived).map(c=>c.deck))].sort().map(d=>`<option value="${E(d)}"${d===selected?' selected':''}>${E(d)}</option>`).join('');
const activeCards = () => state.cards.filter(c=>!c.archived);
const queue = () => C.dueCards(state.cards,state.logs,Date.now(),state.settings.newLimit).filter(c=>!state.review.deck || c.deck===state.review.deck);
const findCard = id => state.cards.find(c=>c.id===id);
const byId = id => $(`[data-card-id="${id}"]`);
const dueLabel = card => card.archived ? 'Archived' : card.schedule.state==='new' ? 'New word' : card.schedule.due<=Date.now() ? 'Ready to review' : `In ${C.intervalLabel(card.schedule.due-Date.now())}`;
function toast(message, actionLabel='', action=null, error=false) {
 const el=$('#toast');clearTimeout(toastTimer);state.toastAction=action;
 el.innerHTML=`<span>${E(message)}</span>${actionLabel?`<button data-action="toast-action">${E(actionLabel)}</button>`:''}`;
 el.className=`toast${error?' error':''}`;el.hidden=false;toastTimer=setTimeout(()=>{el.hidden=true;state.toastAction=null;},action?12000:6000);
}
function showError(error) {console.error(error);toast(error?.message || 'Something went wrong. Your existing words have not been removed.','',null,true);}
function modalError(message) {let el=$('#modal-error');if(!el){el=document.createElement('div');el.id='modal-error';el.className='error-banner';el.setAttribute('role','alert');$('#modal-body').prepend(el);}el.textContent=message;el.scrollIntoView({block:'nearest'});}
function showModal(title,body) {$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;if(!modal.open)modal.showModal();}
function closeModal() {modal.close();state.receiving=null;}
function navigate(view, push=true) {
 if(!['translate','graph','library','review','exchange','settings'].includes(view))view='translate';
 state.view=view;
 if(push){const u=new URL(location.href);u.searchParams.set('view',view);u.hash='';history.pushState({view},'',u);}
 if(view==='review' && !state.review.cardId)selectReview();
 render();main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});
 if(view==='exchange' && state.user)refreshExchange().catch(e=>{state.exchangeError=e.message;if(state.view==='exchange')render();});
}
function renderNav() {
 const due=C.dueCards(state.cards,state.logs,Date.now(),state.settings.newLimit).length;
 $('#navigation').innerHTML=[['translate','Translate'],['graph','Words'],['library','Library'],['review','Review'],['exchange','Exchange']].map(([id,label])=>`<button class="nav-item${state.view===id?' active':''}" data-action="go" data-view="${id}"${state.view===id?' aria-current="page"':''}>${icon(id)}<span>${label}</span>${id==='review'&&due?`<span class="badge">${due}</span>`:id==='graph'?'<span class="badge">300</span>':''}</button>`).join('');
 $('#settings-nav').innerHTML=`${icon('settings')}<span>Settings & data</span>`;
 $('#settings-nav').classList.toggle('active',state.view==='settings');
 $('#avatar').textContent=(state.settings.alias || state.user?.handle || 'N')[0].toUpperCase();
 $('#connection').textContent=navigator.onLine ? state.user ? `@${state.user.handle}` : 'On this device' : 'Offline';
 $('#connection').classList.toggle('offline',!navigator.onLine);
}
function render() {
 renderNav();
 main.innerHTML=({translate:renderTranslate,graph:renderGraph,library:renderLibrary,review:renderReview,exchange:renderExchange,settings:renderSettings}[state.view])();
}
function pageHeading(kicker,title,description,actions='') {
 return `<div class="page-heading compact"><div><h1>${title}</h1>${description?`<p>${E(description)}</p>`:''}</div>${actions}</div>`;
}
function renderTranslate() {
 const t=state.translation;
 return `${pageHeading('','Translate','Every translation is saved to your library.')}
 <div class="translate-layout"><div><section class="panel translator" aria-label="Translator">
 ${languageBar()}
 <div class="translation-panes"><div class="source-pane"><label class="pane-label" for="translation-input">${E(C.languageName(t.sourceLang))}</label><textarea id="translation-input" class="translation-input" dir="auto" lang="${t.sourceLang}" maxlength="2000" spellcheck="false" placeholder="Type a word or phrase">${E(t.front)}</textarea><div class="pane-tools"><div class="result-tools"><button class="icon-button" data-action="speak-source" aria-label="Listen to source text">${icon('speaker')}</button><button class="icon-button" data-action="clear-translation" aria-label="Clear translation">${icon('close')}</button></div><span class="character-count" id="character-count">${t.front.length} / 2,000</span></div></div><div class="target-pane" id="translation-output" aria-live="polite" aria-atomic="false">${renderOutput()}</div></div>
 <div class="translator-toolbar"><div class="provider-note" id="provider-note">${providerLabel()}</div><div class="button-row"><button class="button secondary" data-action="translate-selection" id="selection-button" hidden>Selection</button><button class="button primary" data-action="translate" id="translate-button"${t.busy?' disabled':''}>${t.busy?'Translating...':`Translate ${icon('arrow')}`}</button></div></div>
 <div id="word-suggestions" class="word-suggestions">${renderSuggestions()}</div>
 </section>
 <div class="translation-meta"><span>300 meanings offline. ${state.settings.provider==='local'?'Offline vocabulary only.':state.settings.provider==='public'?'Other text uses MyMemory with permission.':'Other text uses DeepL when connected.'}</span><span>Enter to translate</span></div>
 <details class="panel translation-options"${t.context?' open':''}><summary>Sentence context & tone</summary><label for="translation-context">Context for DeepL (optional)</label><textarea id="translation-context" class="input" rows="2" maxlength="1500" dir="auto" placeholder="The sentence around the word">${E(t.context)}</textarea><div class="context-controls"><span class="small-print">Sent to DeepL only for a cloud translation.</span><label for="translation-formality">Tone <select class="select" id="translation-formality"><option value="default"${t.formality==='default'?' selected':''}>Default</option><option value="prefer_more"${t.formality==='prefer_more'?' selected':''}>Formal</option><option value="prefer_less"${t.formality==='prefer_less'?' selected':''}>Casual</option></select></label></div>${state.backend?.translationEnabled?'<button class="text-button space-top" data-action="cloud-translate">Translate with DeepL instead</button>':''}</details>
 <div id="connections">${renderConnections(t.conceptId)}</div>
 <section class="recent-section"><div class="section-topline"><h2>Recent</h2><button class="text-button" data-action="go" data-view="library">Open library ${icon('arrow')}</button></div>${renderRecent()}</section></div>
 <aside class="translate-aside">${renderDaily()}<section class="panel starter-panel"><div class="section-topline"><h2>Start with a word</h2><span>Offline</span></div><div class="starter-words">${['food.water','essentials.hello','essentials.thanks','work.book','home.house','people.friend'].map(id=>{const c=G.concept(id);return `<button data-action="graph-word" data-id="${id}"><strong dir="auto" lang="${t.sourceLang}">${E(c.terms[t.sourceLang])}</strong><span dir="auto" lang="${t.targetLang}">${E(c.terms[t.targetLang])}</span>${icon('arrow')}</button>`;}).join('')}</div><button class="text-button" data-action="go" data-view="graph">Browse all 300 ${icon('arrow')}</button></section></aside></div>`;
}
function languageBar(graph=false){const t=state.translation;return `<div class="translator-languagebar"><div class="language-slot"><span class="lang-dot">${C.languageCode(t.sourceLang)}</span><label class="sr-only" for="source-language">Translate from</label><select id="source-language" class="language-select">${langOptions(t.sourceLang)}</select></div><button class="swap-button" data-action="swap" aria-label="Swap languages">${icon('swap')}</button><div class="language-slot"><label class="sr-only" for="target-language">Translate into</label><select id="target-language" class="language-select">${langOptions(t.targetLang)}</select><span class="lang-dot">${C.languageCode(t.targetLang)}</span></div></div>`;}
function providerLabel(){const p=state.translation.provider;return `${icon(p==='Word graph'?'book':'globe')}<span>${E(p||'300 words available offline')}</span>`;}
function renderOutput(){
 const t=state.translation;
 if(t.busy)return `<div class="pane-label">${E(C.languageName(t.targetLang))}</div><div class="translation-loading"><span class="spinner" aria-hidden="true"></span><span>Translating...</span></div>`;
 if(t.choices?.length)return `<div class="pane-label">Choose the meaning</div><div class="sense-choices">${t.choices.map(c=>`<button data-action="choose-sense" data-id="${c.id}"><strong dir="auto" lang="${t.targetLang}">${E(c.terms[t.targetLang])}</strong><span>${E(c.sense)} <small>${E(G.CATEGORIES[c.category])}</small></span>${icon('arrow')}</button>`).join('')}</div>`;
 if(t.error)return `<div class="pane-label">Translation unavailable</div><div class="translation-error" role="alert">${E(t.error)}</div><button class="text-button" data-action="translate">Try again</button> <button class="text-button" data-action="add-manual">Add a translation</button>`;
 if(!t.back)return `<div class="pane-label">${E(C.languageName(t.targetLang))}</div><div class="placeholder-result"><p>${t.missing?'Not in the offline vocabulary.':'Translation'}</p></div>${t.missing?`<div class="missing-help">${state.backend?.translationEnabled?'<button class="button secondary" data-action="cloud-translate">Use DeepL</button>':'<button class="text-button" data-action="go" data-view="settings">Connect DeepL for other words</button>'}<button class="text-button" data-action="add-manual">Add a translation</button></div>`:'<div class="pane-tools"><span class="character-count">Saved automatically after translation</span></div>'}`;
 const c=G.concept(t.conceptId),saved=findCard(t.savedCardId)||state.cards.find(x=>!x.archived&&C.identity(x)===C.identity(t));
 return `<div class="pane-label">${E(C.languageName(t.targetLang))}</div><div class="translation-result" dir="auto" lang="${t.targetLang}">${E(t.back)}</div>${c?`<div class="sense-label">${E(c.sense)} <span>${E(G.CATEGORIES[c.category])}</span></div>`:''}<div class="pane-tools"><div class="result-tools"><button class="icon-button" data-action="speak-target" aria-label="Listen to translation">${icon('speaker')}</button><button class="icon-button" data-action="copy-translation" aria-label="Copy translation">${icon('copy')}</button><button class="icon-button" data-action="edit-translation" aria-label="Edit saved translation">${icon('edit')}</button>${saved?`<button class="icon-button" data-action="share-card" data-id="${saved.id}" aria-label="Share this word">${icon('share')}</button>`:''}</div><span class="save-status" role="status">${t.saving?'Saving...':t.saveError?'Not saved':saved&&!saved.archived?icon('check')+' Saved':'Not saved'}</span></div>${t.saveError?`<div class="save-error" role="alert">${E(t.saveError)} <button class="text-button" data-action="retry-save">Retry save</button></div>`:''}`;
}
function updateOutput(){
 if(state.view!=='translate')return;
 const out=$('#translation-output');if(out)out.innerHTML=renderOutput();
 const note=$('#provider-note');if(note)note.innerHTML=providerLabel();
 const b=$('#translate-button');if(b){b.disabled=state.translation.busy;b.innerHTML=state.translation.busy?'Translating...':`Translate ${icon('arrow')}`;}
 const links=$('#connections');if(links)links.innerHTML=renderConnections(state.translation.conceptId);
}
function renderSuggestions(){
 const t=state.translation,q=t.front.trim();if(!q||t.back||t.busy||t.choices?.length||q.length>100)return '';
 const results=G.search(q,t.sourceLang,t.targetLang,'',6).filter(c=>G.normalizeWord(c.terms[t.sourceLang],t.sourceLang).includes(G.normalizeWord(q,t.sourceLang))||(c.aliases[t.sourceLang]||[]).some(x=>G.normalizeWord(x,t.sourceLang).includes(G.normalizeWord(q,t.sourceLang))));
 if(results.length)return `<div class="suggestion-heading">In the word graph</div>${results.map(c=>`<button data-action="graph-word" data-id="${c.id}"><strong dir="auto">${E(c.terms[t.sourceLang])}</strong><span>${E(c.sense)}</span><small>${E(c.terms[t.targetLang])}</small></button>`).join('')}`;
 const detected=G.detect(q,t.sourceLang).filter(x=>x.language!==t.targetLang||t.sourceLang!==t.targetLang).slice(0,4);
 return detected.length?`<div class="suggestion-heading">Found in another language</div>${detected.map(({concept:c,language})=>`<button data-action="graph-word" data-id="${c.id}" data-source="${language}"><strong dir="auto">${E(c.terms[language])}</strong><span>${E(C.languageName(language))} / ${E(c.sense)}</span><small>Use ${C.languageCode(language)}</small></button>`).join('')}`:'';
}
function renderConnections(id){
 const c=G.concept(id);if(!c)return '';
 const t=state.translation;
 return `<section class="panel word-connections"><div class="section-topline"><h2>In every language</h2><span>${G.LANGUAGES.length} linked forms</span></div><div class="language-links">${G.LANGUAGES.map(lang=>`<button class="language-link${lang===t.targetLang?' selected':''}${lang===t.sourceLang?' source':''}" data-action="graph-target" data-id="${c.id}" data-language="${lang}"${lang===t.sourceLang?' disabled':''} aria-label="${E(C.languageName(lang)+': '+c.terms[lang])}"${lang===t.targetLang?' aria-pressed="true"':' aria-pressed="false"'}><span>${E(C.languageName(lang))}${lang===t.sourceLang?' / source':''}</span><strong lang="${lang}" dir="auto">${E(c.terms[lang])}</strong></button>`).join('')}</div>${c.note?`<details class="word-note"><summary>Usage note</summary><p>${E(c.note)}</p></details>`:''}<div class="related-words"><span>Related</span>${G.related(c.id,6).map(({concept:x,relation})=>`<button class="starter-chip" data-action="graph-word" data-id="${x.id}" title="${E(relation)}" lang="${t.sourceLang}" dir="auto">${E(x.terms[t.sourceLang])}</button>`).join('')}</div></section>`;
}
function renderRecent(){
 if(!state.history.length)return '<p class="recent-empty">Your translations will appear here.</p>';
 return `<div class="recent-list">${state.history.slice(0,5).map((t,i)=>`<button class="recent-row" data-action="recent" data-index="${i}"><span class="lang-dot">${C.languageCode(t.sourceLang)}</span><span class="recent-word" dir="auto">${E(t.front)}</span>${icon('arrow')}<span class="recent-meaning" dir="auto">${E(t.back)}</span><span class="lang-dot">${C.languageCode(t.targetLang)}</span></button>`).join('')}</div>`;
}
function renderDaily(){const s=C.statistics(state.cards,state.logs),due=queue().length;return `<section class="panel side-card"><div class="side-card-title"><span>Review</span>${icon('review')}</div><div class="daily-number">${due}<small>due now</small></div><button class="button ${due?'primary':'soft'} full-width" data-action="go" data-view="review">${due?'Start review':'Open review'} ${icon('arrow')}</button><div class="side-divider"></div><div class="side-stat"><span>Saved words</span><strong>${s.total}</strong></div><div class="side-stat no-margin"><span>Reviewed today</span><strong>${s.distinctToday}</strong></div></section>`;}
function renderGraph(){
 return `${pageHeading('','300 words','Choose a word. Switch languages. It saves automatically.','<button class="button secondary" data-action="export-graph">Export graph</button>')}<section class="panel graph-languages">${languageBar(true)}</section><div class="graph-toolbar"><div class="search-field">${icon('search')}<label class="sr-only" for="graph-search">Search all words</label><input id="graph-search" class="input" type="search" placeholder="Search any language" value="${E(state.graph.query)}"></div><label class="sr-only" for="graph-category">Topic</label><select class="select" id="graph-category"><option value="">All topics</option>${Object.entries(G.CATEGORIES).map(([id,label])=>`<option value="${id}"${state.graph.category===id?' selected':''}>${E(label)}</option>`).join('')}</select><span id="graph-count">${G.search(state.graph.query,state.translation.sourceLang,state.translation.targetLang,state.graph.category).length} meanings</span></div><div class="graph-layout"><div id="graph-results">${renderGraphResults()}</div><div id="graph-detail">${renderGraphDetail()}</div></div>`;
}
function renderGraphResults(){const t=state.translation,list=G.search(state.graph.query,t.sourceLang,t.targetLang,state.graph.category);return list.length?`<div class="panel graph-list">${list.map(c=>`<button class="graph-row${c.id===state.graph.selectedId?' active':''}" data-action="graph-word" data-id="${c.id}"${c.id===state.graph.selectedId?' aria-current="true"':''}><span><strong lang="${t.sourceLang}" dir="auto">${E(c.terms[t.sourceLang])}</strong><small>${E(c.sense)}</small></span><span class="graph-row-target" lang="${t.targetLang}" dir="auto">${E(c.terms[t.targetLang])}</span>${icon('arrow')}</button>`).join('')}</div>`:'<div class="empty-state"><h2>No matching words</h2><p>Try another word or topic.</p><button class="text-button" data-action="reset-graph">Clear filters</button></div>';}
function renderGraphDetail(){
 const c=G.concept(state.graph.selectedId);if(!c)return '<div class="panel graph-placeholder"><h2>12 languages. One meaning.</h2><p>Select a word to see all its translations.</p><p class="small-print">The graph links matching meanings, not word-by-word sentence translations.</p></div>';
 const t=state.translation;return `<section class="panel graph-selected"><span class="pane-label">${E(C.languageName(t.sourceLang))} / ${E(C.languageName(t.targetLang))}</span><h2 lang="${t.sourceLang}" dir="auto">${E(c.terms[t.sourceLang])}</h2><p class="graph-selected-target" lang="${t.targetLang}" dir="auto">${E(c.terms[t.targetLang])}</p><div class="button-row"><span class="save-status">${t.saving?'Saving...':t.saveError?'Not saved':icon('check')+' Saved'}</span><button class="icon-button" data-action="speak-target" aria-label="Listen to translation">${icon('speaker')}</button><button class="text-button" data-action="go" data-view="review">Review</button></div>${t.saveError?`<div class="save-error">${E(t.saveError)} <button class="text-button" data-action="retry-save">Retry save</button></div>`:''}</section>${renderConnections(c.id)}`;
}
function renderLibrary(){const total=activeCards().length,due=C.dueCards(state.cards,state.logs,Date.now(),state.settings.newLimit).length;
 return `${pageHeading('YOUR PERSONAL WORD COLLECTION','Library','Translations are saved here automatically.',`<div class="button-row"><button class="button secondary" data-action="import">${icon('upload')} Import</button><button class="button primary" data-action="add-manual">${icon('plus')} Add word</button></div>`)}
 <div class="stats-line"><span><strong>${total}</strong> saved words</span><span><strong>${due}</strong> ready to review</span><span><strong>${new Set(activeCards().map(c=>c.sourceLang)).size}</strong> languages</span></div>
 <div class="library-toolbar"><div class="search-field">${icon('search')}<label class="sr-only" for="library-search">Search words, meanings, and tags</label><input id="library-search" class="input" type="search" value="${E(state.filters.q)}" placeholder="Search words, translations or tags"></div><label class="sr-only" for="filter-language">Filter language</label><select id="filter-language" class="select"><option value="">All languages</option>${langOptions(state.filters.lang)}</select><label class="sr-only" for="filter-deck">Filter collection</label><select id="filter-deck" class="select">${deckOptions(state.filters.deck)}</select><label class="sr-only" for="filter-status">Filter status</label><select id="filter-status" class="select">${[['','All words'],['due','Ready to review'],['new','New words'],['archived','Archived']].map(([v,l])=>`<option value="${v}"${state.filters.status===v?' selected':''}>${l}</option>`).join('')}</select><label class="sr-only" for="filter-sort">Sort cards</label><select id="filter-sort" class="select">${[['recent','Newest first'],['alphabetical','Alphabetical'],['due','Due first']].map(([v,l])=>`<option value="${v}"${state.filters.sort===v?' selected':''}>${l}</option>`).join('')}</select></div>
 <div id="library-results">${renderLibraryResults()}</div>`;
}
function filteredCards(){const f=state.filters;
 let cards=state.cards.filter(c=>(f.status==='archived'?c.archived:!c.archived)&&(!f.lang||c.sourceLang===f.lang)&&(!f.deck||c.deck===f.deck)&&(!f.q||C.searchText([c.front,c.back,c.context,c.deck,...c.tags].join(' ')).includes(C.searchText(f.q)))&&(f.status!=='due'||c.schedule.due<=Date.now())&&(f.status!=='new'||c.schedule.state==='new'));
 return cards.sort(f.sort==='alphabetical'?(a,b)=>a.front.localeCompare(b.front):f.sort==='due'?(a,b)=>a.schedule.due-b.schedule.due:(a,b)=>b.createdAt-a.createdAt);
}
function renderLibraryResults(){const cards=filteredCards();
 if(!cards.length)return `<div class="empty-state">${icon(state.cards.length?'search':'library')}<h2>${state.cards.length?'No matching words':'No saved words yet'}</h2><p>${state.cards.length?'Try a different search or filter. Your other words are still in your library.':'Translate a word and it appears here automatically.'}</p><div class="button-row">${state.cards.length?'<button class="button secondary" data-action="reset-filters">Clear filters</button>':'<button class="button primary" data-action="go" data-view="translate">Translate a word</button><button class="button secondary" data-action="add-manual">Add manually</button>'}</div></div>`;
 return `<div class="section-topline"><span>${cards.length} ${cards.length===1?'word':'words'}${cards.length>state.limit?` &middot; showing ${state.limit}`:''}</span><button class="text-button" data-action="export-tsv">${icon('download')} Export to Anki</button></div><div class="word-grid">${cards.slice(0,state.limit).map(renderWordCard).join('')}</div>${cards.length>state.limit?'<div class="list-footer"><button class="button secondary" data-action="load-more">Show more words</button></div>':''}`;
}
function renderWordCard(c){return `<article class="panel word-card" data-card-id="${c.id}"><div class="word-card-top"><span class="lang-dot">${C.languageCode(c.sourceLang)}</span><span class="pill ${c.archived?'':c.schedule.state==='new'?'sand':c.schedule.due<=Date.now()?'green':''}">${dueLabel(c)}</span></div><div class="word-card-body"><h2 class="card-word" lang="${c.sourceLang}" dir="auto">${E(c.front)}</h2><p class="card-meaning" lang="${c.targetLang}" dir="auto">${E(c.back)}</p>${c.conceptId&&G.concept(c.conceptId)?`<p class="card-sense">${E(G.concept(c.conceptId).sense)}</p>`:''}${c.context?`<p class="card-context" dir="auto">${E(c.context)}</p>`:''}</div><div class="word-card-footer"><span class="card-deck" title="${E(c.deck)}">${E(c.deck)}</span><div class="card-actions"><button class="icon-button" data-action="speak-card" data-id="${c.id}" aria-label="Listen to ${E(c.front)}">${icon('speaker')}</button><button class="icon-button" data-action="edit-card" data-id="${c.id}" aria-label="Edit ${E(c.front)}">${icon('edit')}</button><button class="icon-button" data-action="share-card" data-id="${c.id}" aria-label="Share ${E(c.front)}">${icon('share')}</button><button class="icon-button" data-action="archive-card" data-id="${c.id}" aria-label="${c.archived?'Restore':'Archive'} ${E(c.front)}">${icon(c.archived?'undo':'archive')}</button></div></div></article>`;}
function selectReview(){const c=queue()[0];state.review.cardId=c?.id || null;state.review.revealed=false;state.review.typed='';state.review.startedAt=Date.now();renderedReviewRevision=c?.revision;}
function renderReview(){const r=state.review;let c=findCard(r.cardId);if(!c||c.archived){selectReview();c=findCard(r.cardId);}const qs=queue(), previewAt=Date.now();
 const header=pageHeading('SMALL PRACTICE. REAL PROGRESS.','Review','Recall the meaning, reveal it, then rate your answer.');
 if(!c){const future=activeCards().filter(c=>(!r.deck||c.deck===r.deck)&&c.schedule.state!=='new'&&c.schedule.due>Date.now()).sort((a,b)=>a.schedule.due-b.schedule.due)[0];const newRemaining=activeCards().filter(c=>c.schedule.state==='new').length;

function invalidateTranslation(clearContext=false){
 state.translationEpoch++;state.abort?.abort();state.graph.selectedId='';
 Object.assign(state.translation,{busy:false,back:'',error:'',provider:'',conceptId:'',choices:[],missing:false,savedCardId:'',saving:false,saveError:'',note:''});

function timeoutFetch(url, options={}, signal, ms=18000){
 const controller=new AbortController();const abort=()=>controller.abort(signal?.reason);if(signal?.aborted)abort();else signal?.addEventListener('abort',abort,{once:true});
 const timer=setTimeout(()=>controller.abort(new DOMException('Translation took too long.','TimeoutError')),ms);
 return fetch(url,{...options,signal:controller.signal}).finally(()=>{clearTimeout(timer);signal?.removeEventListener('abort',abort);});
}
function decodeEntities(value){const t=document.createElement('textarea');t.innerHTML=value;return t.value;}
async function keepTranslation(epoch=state.translationEpoch){
 const t=state.translation;if(!t.back||t.busy)return;
 const item={...t},c=G.concept(t.conceptId);
 t.saving=true;t.saveError='';updateOutput();
 try{
  const result=await DB.commitTranslation({...item,deck:'My words',tags:c?[c.category]:[],note:c?.note||item.note||''},()=>epoch===state.translationEpoch);
  if(!result)return;
  await loadData(false);channel?.postMessage({changed:true});
  if(epoch!==state.translationEpoch)return;
  t.savedCardId=result.card.id;t.saving=false;
  if(state.view==='translate'||state.view==='graph')render();else renderNav();
 }catch(error){
  if(epoch!==state.translationEpoch)return;
  t.saving=false;t.saveError='Could not save. '+(error.message||'Check browser storage and retry.');
  updateOutput();if(state.view==='graph')render();
 }
}

async function translate(options={}){
 const t=state.translation,front=t.front.trim();
 if(!front){$('#translation-input')?.focus();return;}
 if(front.length>C.MAX_TEXT)throw new Error('Use at most 2,000 characters.');
 if(t.sourceLang===t.targetLang)throw new Error('Choose two different languages.');
 if(!options.forceCloud&&(!t.context.trim()||!state.backend?.translationEnabled)){
  const found=G.resolve(front,t.sourceLang,t.targetLang);
  if(found.status==='found'&&!t.context.trim()){await useGraph(found.conceptId);return;}
  if(found.status==='found'&&t.context.trim()){invalidateTranslation();t.choices=[found.concept];render();return;}
  if(found.status==='ambiguous'){
   invalidateTranslation();t.choices=found.candidates;render();return;
  }
 }
 let provider=state.settings.provider==='local'?'local':state.settings.provider==='public'?'public':state.backend?.translationEnabled?'workspace':'local';
 if(options.forceCloud)provider=state.backend?.translationEnabled?'workspace':'local';
 if(provider==='local'){
  invalidateTranslation();t.missing=true;updateOutput();const el=$('#word-suggestions');if(el)el.innerHTML=renderSuggestions();return;
 }
 if(provider==='public'&&!state.settings.consent){
  showModal('Use online translation?',`<p class="modal-intro">This word is outside the offline vocabulary. MyMemory receives the text you translate. Do not send confidential information.</p><div class="modal-footer"><button class="button secondary" data-action="close-modal">Cancel</button><button class="button primary" data-action="allow-public">Allow & translate</button></div>`);return;
 }
 if(provider==='workspace'&&!state.user){state.resumeTranslation=true;openAuth('login');return;}
 state.abort?.abort();state.abort=new AbortController();const signal=state.abort.signal,epoch=++state.translationEpoch;
 const source=t.sourceLang,target=t.targetLang,context=t.context,formality=t.formality||'default';
 state.graph.selectedId='';
 Object.assign(t,{busy:true,error:'',back:'',provider:'',choices:[],conceptId:'',savedCardId:'',saveError:'',missing:false});updateOutput();
 const sugg=$('#word-suggestions');if(sugg)sugg.innerHTML='';
 try{
  const key=JSON.stringify(['context-v1',provider,source,target,front.normalize('NFC'),provider==='workspace'?context:'',provider==='workspace'?formality:'default',state.backend?.translationEnglish||'',state.backend?.translationPortuguese||'']);
  const cached=await DB.cacheGet(key);let translated=cached;
  if(epoch!==state.translationEpoch)return;
  if(!translated){
   if(!navigator.onLine)throw new Error('Offline. The 300 built-in meanings still work.');
   if(provider==='workspace'){
    const response=await api('translate',{method:'POST',body:{text:front,sourceLang:source,targetLang:target,context,formality},signal,ms:35000});translated=response.translation;
   }else{
    const parts=[];
    for(const chunk of C.chunkText(front)){
     if(!chunk.trim())continue;
     const url=new URL('https://api.mymemory.translated.net/get');url.searchParams.set('q',chunk.trim());url.searchParams.set('langpair',`${source}|${target}`);
     const response=await timeoutFetch(url,{credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store'},signal);
     if(!response.ok)throw new Error(response.status===429?'Translation limit reached. Try later.':'Translation service unavailable.');
     const data=await response.json();
     if(Number(data.responseStatus)!==200||data.quotaFinished)throw new Error('Translation service unavailable or quota reached.');
     if(typeof data.responseData?.translatedText!=='string'||!data.responseData.translatedText.trim())throw new Error('No translation returned.');
     parts.push(decodeEntities(data.responseData.translatedText).trim());
    }
    translated=parts.join(' ');
   }
   if(typeof translated!=='string'||!translated.trim())throw new Error('No translation returned.');
   if(translated.length>10000)throw new Error('The translation is too long. Translate a shorter passage.');
   // Cache failure must not discard an otherwise usable translation.
   try{await DB.cachePut(key,translated);}catch(error){console.warn('Translation caching failed.',error);}
  }
  if(epoch!==state.translationEpoch)return;
  Object.assign(t,{front,back:translated,provider:(cached?'Cached / ':'')+(provider==='workspace'?'DeepL':'MyMemory'),busy:false,saving:true});
  await keepTranslation(epoch);await rememberPair();
 }catch(error){
  if(epoch!==state.translationEpoch)return;
  t.error=error.name==='TimeoutError'?'Translation timed out. Try again.':error.name==='AbortError'?'Translation interrupted. Try again.':error.message==='Failed to fetch'?'Cannot reach the translation service.':error.message;
  t.busy=false;updateOutput();
 }
}

async function requestSpeech(body,signal){
 const controller=new AbortController(),abort=()=>controller.abort();
 if(signal.aborted)abort();else signal.addEventListener('abort',abort,{once:true});
 const timer=setTimeout(()=>controller.abort(new DOMException('Speech generation took too long.','TimeoutError')),50000);
 try{
  const response=await fetch(new URL('./api/speech',location.href),{method:'POST',credentials:'same-origin',cache:'no-store',signal:controller.signal,headers:{'Content-Type':'application/json','Accept':'audio/mpeg','X-CSRF-Token':state.csrf},body:JSON.stringify(body)});
  if(!response.ok){let data;try{data=await response.json();}catch{}if(response.status===401){state.user=null;state.csrf='';}throw new Error(typeof data?.detail==='string'?data.detail:'Pronunciation is unavailable. No replacement voice was used.');}
  const blob=await response.blob();if(blob.size>6*1024*1024)throw new Error('The pronunciation was unexpectedly large.');return blob;
 }catch(error){if(controller.signal.reason?.name==='TimeoutError')throw new Error('Speech generation timed out. Retry manually.');throw error;}
 finally{clearTimeout(timer);signal.removeEventListener('abort',abort);}
}
async function speak(value,language){

 if(!state.user){openAuth('login');return;}
 if(!state.backend.speechLanguages.includes(language))throw new Error(`No server voice is configured for ${C.languageName(language)}. Choose a voice for this language before using cloud speech.`);
 if(!state.settings.speechConsent){
  pendingSpeech={value,language};
  showModal('Enable pronunciation',`<p class="modal-intro">Nabu sends only the text you ask to hear to ElevenLabs through your server. The resulting voice is AI-generated. Your private notes and review history are not sent.</p><p class="small-print">Provider processing and retention follow your ElevenLabs plan. Audio is cached temporarily in this tab and on the server for repeat playback; it is not added to your backup. No audio is generated automatically.</p><div class="modal-footer"><button class="button secondary" data-action="close-modal">Not now</button><button class="button primary" data-action="allow-speech">Enable speech & listen</button></div>`);return;
 }

function speakDevice(value,language){

 if(!('speechSynthesis' in window))return toast('Speech is not supported in this browser.');
 const voices=speechSynthesis.getVoices(),base=language.split('-')[0].toLowerCase();
 const voice=voices.find(v=>v.lang.toLowerCase()===language.toLowerCase()) || voices.find(v=>v.lang.split('-')[0].toLowerCase()===base);
 if(!voice){toast(`No ${C.languageName(language)} voice is installed on this device.`);return;}
 speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(value.slice(0,2000));utterance.lang=voice.lang;utterance.voice=voice;utterance.rate=state.settings.speechRate;utterance.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')toast('Audio could not play on this device.');};speechSynthesis.speak(utterance);

}
function openEditor(card=null,edit=false,received=null){
 state.editorCard=card?{...card}:null;state.editMode=edit;state.receiving=received;

  let result;
  if(state.editMode){await DB.editCard(state.editorCard.id,content,state.editorCard.revision);result={added:1,duplicates:0};}
  else{const inputs=[content];if(data.has('reverse'))inputs.push(C.reverseCard(content));result=await DB.addCards(inputs);}
  const receiving=state.receiving,editing=state.editMode;if(editing&&state.editorCard?.id===state.translation.savedCardId){Object.assign(state.translation,{front:content.front,back:content.back,sourceLang:content.sourceLang,targetLang:content.targetLang});}closeModal();await changed();toast(editing?'Changes saved.':result.added?`${result.added===1?'Word':`${result.added} words`} added to your collection.`:'This word and meaning are already in your library.');

async function api(path,{method='GET',body,signal,ms=18000}={}){
 const response=await timeoutFetch(new URL(`./api/${path}`,location.href),{method,credentials:'same-origin',cache:'no-store',headers:{'Accept':'application/json',...(body?{'Content-Type':'application/json'}:{}),...(method!=='GET'&&state.csrf?{'X-CSRF-Token':state.csrf}:{})},...(body?{body:JSON.stringify(body)}:{})},signal,ms);
 let data;try{data=await response.json();}catch{throw new Error('The Nabu inbox server is not available at this address.');}
 if(!response.ok){if(response.status===401){state.user=null;state.csrf='';}throw new Error(typeof data.detail==='string'?data.detail:'That request could not be completed. Please try again.');}
 return data;
}

document.addEventListener('submit',async event=>{

   const speechRate=Number(data.speechRate);if(![1,0.85].includes(speechRate))throw new Error('Choose a supported playback speed.');
   const defaultsChanged=data.sourceLang!==state.settings.sourceLang||data.targetLang!==state.settings.targetLang;
   speaker.clear();
   state.settings={...state.settings,...data,speechRate,speechConsent:data.speechConsent==='on',newLimit:limit,alias:C.text(data.alias,'Display name',40)};await saveSettings();
   if(defaultsChanged){invalidateTranslation(true);state.translation.sourceLang=data.sourceLang;state.translation.targetLang=data.targetLang;}render();toast('Preferences saved.');
  }

   speaker.clear();invalidateTranslation();await DB.clearAll();state.settings={...DEFAULTS};state.graph={query:'',category:'',selectedId:''};state.review={cardId:null,revealed:false,typed:'',startedAt:0,count:0,undo:null,deck:'',busy:false};state.translation={front:'',back:'',sourceLang:'en',targetLang:'es',context:'',formality:'default',note:'',provider:'',busy:false,error:''};closeModal();await changed();toast('Local data removed. Your exchange account was not changed.');
  }
  if(form.id==='auth-form'){
   const result=await api(form.dataset.mode==='register'?'register':'login',{method:'POST',body:data});speaker.clear();state.user=result.user;state.csrf=result.csrf;closeModal();await refreshExchange();render();toast(`Signed in as @${state.user.handle}.`);if(state.resumeTranslation){state.resumeTranslation=false;await translate({forceCloud:true});}

  if(form.id==='send-form'){
   const card=C.sharePayload(state.shareCard).card;
   await api('exchanges',{method:'POST',body:{recipient:data.recipient,message:data.message,card,requestId:form.dataset.requestId || (form.dataset.requestId=C.uid())}});
   closeModal();await refreshExchange();toast('Word sent. Your friend can choose to keep it.');
  }
  if(form.id==='delete-account-form'){
   speaker.clear();await api('account',{method:'DELETE',body:{password:data.password}});state.user=null;state.csrf='';state.inbox=[];state.sent=[];closeModal();render();toast('Exchange account deleted. Your local library is untouched.');
  }
 }catch(e){if(modal.open)modalError(e.message);else showError(e);}finally{if(button)button.disabled=false;}
});
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.id==='graph-search'){state.graph.query=el.value;$('#graph-results').innerHTML=renderGraphResults();$('#graph-count').textContent=G.search(el.value,state.translation.sourceLang,state.translation.targetLang,state.graph.category).length+' meanings';}
 if(el.id==='translation-context'){const value=el.value;invalidateTranslation();state.translation.context=value;updateOutput();}
 if(el.id==='translation-input'){invalidateTranslation();state.translation.front=el.value;$('#character-count').textContent=`${el.value.length} / 2,000`;updateOutput();const suggest=$('#word-suggestions');if(suggest)suggest.innerHTML=renderSuggestions();}
 if(el.id==='library-search'){state.filters.q=el.value;state.limit=60;$('#library-results').innerHTML=renderLibraryResults();}
 if(el.id==='review-typed')state.review.typed=el.value;
 if(el.closest('#send-form'))delete el.closest('#send-form').dataset.requestId;
 if(el.id==='pick-share-search')$('#share-picker').innerHTML=renderSharePicker(activeCards().filter(c=>C.searchText(c.front+' '+c.back).includes(C.searchText(el.value))));
});
document.addEventListener('change',async event=>{
 const el=event.target;
 try{
  if(el.id==='translation-formality'){invalidateTranslation();state.translation.formality=el.value;updateOutput();}
  if(el.id==='source-language'||el.id==='target-language'){
   const old={...state.translation},isSource=el.id==='source-language';let source=isSource?el.value:old.sourceLang,target=isSource?old.targetLang:el.value;
   if(source===target){if(isSource)target=old.sourceLang;else source=old.targetLang;}
   if(G.concept(old.conceptId)){await useGraph(old.conceptId,source,target);}else{invalidateTranslation(true);Object.assign(state.translation,{sourceLang:source,targetLang:target});render();await rememberPair();}
  }
  if(el.id==='graph-category'){state.graph.category=el.value;$('#graph-results').innerHTML=renderGraphResults();$('#graph-count').textContent=G.search(state.graph.query,state.translation.sourceLang,state.translation.targetLang,el.value).length+' meanings';}
  if(el.id==='translation-consent'){state.settings.consent=el.checked;await saveSettings();}
  if(el.id.startsWith('filter-')){const key={'filter-language':'lang','filter-deck':'deck','filter-status':'status','filter-sort':'sort'}[el.id];if(key){state.filters[key]=el.value;state.limit=60;$('#library-results').innerHTML=renderLibraryResults();}}
  if(el.id==='review-deck'){state.review.deck=el.value;selectReview();render();}
  if(el.id==='import-file')await previewImport(el.files[0]);
  if(el.id==='import-source'||el.id==='import-target'){state.importEpoch=(state.importEpoch||0)+1;state.importData=null;$('#import-preview').innerHTML='';$('#import-file').value='';}
 }catch(e){if(modal.open)modalError(e.message);else showError(e);}
});
document.addEventListener('select',event=>{if(event.target.id==='translation-input'){const el=event.target;const button=$('#selection-button');if(button)button.hidden=!(el.selectionEnd>el.selectionStart);}});
document.addEventListener('keydown',event=>{
 if(event.isComposing||modal.open)return;
 const editing=['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName)||event.target.isContentEditable;
 if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();navigate('library');$('#library-search').focus();return;}
 if(event.key==='Enter'&&state.view==='translate'&&!event.shiftKey&&(event.target.id==='translation-input'||event.metaKey||event.ctrlKey)){event.preventDefault();translate().catch(showError);return;}
 if(state.view!=='review'||event.repeat)return;
 if(!state.review.revealed && ((event.key===' '&&!editing)||event.key==='Enter')){event.preventDefault();actions.reveal().catch(showError);}
 else if(state.review.revealed&&!editing&&['1','2','3','4'].includes(event.key)){event.preventDefault();actions.grade({dataset:{rating:event.key}}).catch(showError);}
});
window.addEventListener('popstate',()=>navigate(new URL(location.href).searchParams.get('view')||'translate',false));
window.addEventListener('online',()=>renderNav());window.addEventListener('offline',()=>renderNav());
window.addEventListener('pagehide',()=>{state.abort?.abort();speaker.clear();window.speechSynthesis?.cancel?.();});
channel?.addEventListener('message',async()=>{const id=state.review.cardId,revision=findCard(id)?.revision;await loadData(false);if(state.view==='review'&&findCard(id)?.revision!==revision)selectReview();if(!modal.open&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))render();else renderNav();});
async function handleShare(){
 if(!location.hash.startsWith('#share='))return;
 const token=location.hash.slice(7);history.replaceState(history.state,'',location.pathname+location.search);
 try{const payload=C.decodeShare(token);openEditor(payload.card,false,{sender:payload.sender,verified:false});}
 catch(e){toast(e.message,'',null,true);}
}
window.addEventListener('hashchange',handleShare);
async function boot(){
 try{
  window.NabuStartup?.stage('Opening your private library...');
  await DB.openStore();
  window.NabuStartup?.stage('Loading your words and preferences...');
  const saved=await DB.getMeta('settings',{});state.settings={...DEFAULTS};
  if(saved&&typeof saved==='object'){
   state.settings.alias=typeof saved.alias==='string'?saved.alias.slice(0,40):'';
   for(const key of ['sourceLang','targetLang'])if(C.isLanguage(saved[key]))state.settings[key]=saved[key];
   state.settings.newLimit=Number.isInteger(saved.newLimit)?C.clamp(saved.newLimit,1,100):DEFAULTS.newLimit;
   state.settings.consent=saved.consent===true;state.settings.provider=['auto','local','public','workspace'].includes(saved.provider)?saved.provider:DEFAULTS.provider;
   state.settings.speechProvider=saved.speechProvider==='device'?'device':'cloud';state.settings.speechConsent=saved.speechConsent===true;state.settings.speechRate=saved.speechRate===0.85?0.85:1;
  }
  state.translation.sourceLang=state.settings.sourceLang;state.translation.targetLang=state.settings.targetLang;
  await loadData(false);navigate(new URL(location.href).searchParams.get('view')||'translate',false);
  window.NabuStartup?.ready();
  await handleShare();
  checkBackend().catch(()=>{});
  // Offline installation never gates the local app or masks a successful boot.
  try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./nabu-sw.js', {updateViaCache:'none'}).catch(error=>console.warn('Offline installation unavailable.',error)); } catch (error) { console.warn('Offline installation unavailable.',error); }
  refreshTimer=setInterval(()=>{
   if(document.hidden||modal.open)return;renderNav();
   if(state.view==='review'&&!state.review.cardId&&queue().length){selectReview();render();}
  },15000);
 }catch(e){console.error('Nabu startup failed:',e);if(window.NabuStartup)window.NabuStartup.fail(e);else main.innerHTML=`<div class="fatal"><h1>Your library could not open.</h1><p>${E(e.message)}</p><p>Check that browser storage is allowed, then reload. Nabu has not erased any existing data.</p><a class="button primary" href="./nabu-repair.html">Repair app loading</a></div>`;}
}
boot();

})();</script>
</body>
</html>
